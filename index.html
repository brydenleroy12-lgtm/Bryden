<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road</title>
    <style>
        /* Force the game to fill up 100% of the screen with no borders or scrolling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        /* Make the game window look seamless on your phone or Chromebook */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- This pulls a standalone, full-screen server version of Crossy Road -->
    <iframe src="https://xdg.cc" allowfullscreen=""></iframe>

</body>
</html>
