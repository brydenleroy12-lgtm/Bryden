<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Games</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        iframe { width: 100vw; height: 85vh; border: none; }
        .menu { padding: 10px; background: #222; }
        a { color: #00ffcc; text-decoration: none; font-weight: bold; margin: 0 10px; }
    </style>
</head>
<body>

    <!-- Top Navigation Menu -->
    <div class="menu">
        <p>Select a Game:</p>
        <!-- Change the URLs inside the 'href' below to point to different games -->
        <a href="?game=https://freeonlinegames.com">Game 1</a>
        <a href="?game=https://hwcdn.net">Game 2</a>
    </div>

    <!-- The Window That Loads the Game -->
    <iframe id="game-window" src="https://freeonlinegames.com"></iframe>

    <script>
        // Simple script to let you change games using the links above
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        if (gameUrl) {
            document.getElementById('game-window').src = gameUrl;
        }
    </script>

</body>
</html>
